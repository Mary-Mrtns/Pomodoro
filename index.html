<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>

    <!-- Fonte pixel art importada do goodle fonts -->
     <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

     <!-- Link para o arquivo CSS separado -->
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>
            POMODORO 
            <div class="header-buttons">
                <button class="btn-header" onclick="togglePanel('stats-panel')" title="Histórico">LOG</button>
                <button class="btn-header" onclick="togglePanel('settings-panel')" title="Configurações">OPT</button>
            </div>
        </h1>

        <!-- Painel de configuração de tempo -->
         <div class="panel" id="settings-panel">
            <div class="settings-row">
                <label>FOCO (MIN):</label>
                <input type="number" id="input-foco" value="25" min="1">
            </div>
            <div class="settings-row">
                <label>PAUSA CURTA:</label>
                <input type="number" id="input-curta" value="5" min="1">
            </div>
            <div class="settings-row">
                <label>PAUSA LONGA:</label>
                <input type="number" id="input-longa" value="15" min="1">
            </div>
            <button class="btn-panel btn-save" onclick="saveSettings()">SALVAR</button>
        </div>

        <!-- Painel de histórico (LOG) -->
        <div class="panel" id="stats-panel">
            <div style="text-align: center; margin-bottom: 10px; font-size: 12px;">TEMPO FOCADO</div>
            <ul class="stats-list" id="stats-list">
                <!-- Os dados salvos aparecerão aqui -->
            </ul>
            <button class="btn-panel btn-clear" onclick="clearStats()">APAGAR SAVE</button>
        </div>

        <!-- Seleção de modos -->
        <div class="modes">
            <button id="btn-foco" class="active" onclick="setMode('foco')">FOCO</button>
            <button id="btn-curta" onclick="setMode('curta')">CURTA</button>
            <button id="btn-longa" onclick="setMode('longa')">LONGA</button>
        </div>

        <!-- Display do tempo -->
        <div class="time-display" id="time">25:00</div>

        <!-- Barra de progresso visual pixelada -->
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <!-- Controles -->
         <div class="controls">
            <button onclick="startTimer()">PLAY</button>
            <button onclick="pauseTimer()">PAUSE</button>
            <button onclick="resetTimer()">RESET</button>
        </div>

        <!-- Lista de tarefas -->
        <div class="todo-section">
            <div class="todo-header">QUESTS / TAREFAS</div>
            <div class="todo-input-group">
                <input type="text" id="task-input" placeholder="NOVA TAREFA..." onkeypress="handlekeyPress(event)">
                <button id="btn-add-task" onclick="addTask()">+</button>
            </div>
            <ul class="task-list" id="task-list">
                <!-- As tarefas aparecerão aqui -->
            </ul>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript separado -->
    <script src="script.js"></script>
</body>
</html>
